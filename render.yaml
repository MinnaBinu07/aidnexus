services:
  - type: web
    name: aidnexus-api
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/aidnexus.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: GEMINI_ENABLED
        value: "false"
    disk:
      name: aidnexus-storage
      mountPath: /var/data
      sizeGB: 1
